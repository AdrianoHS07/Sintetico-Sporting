<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mis Reservas</title>

<style>
    *{

margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;

}

body{

background:url("img/CANCHOTAAAAA.png");
background-size:cover;
background-position:center;

}

.overlay{

width:100%;
min-height:100vh;

background:rgba(0,0,0,.65);

display:flex;

justify-content:center;

align-items:center;

padding:30px;

}

.contenedor{

width:100%;
max-width:700px;

}

.escudo{

width:90px;

display:block;

margin:auto;

margin-bottom:20px;

}

h1{

color:white;

text-align:center;

margin-bottom:30px;

}

.panel{

background:rgba(20,20,20,.82);

padding:30px;

border-radius:20px;

}

.reserva{

background:rgba(255,255,255,.08);

padding:20px;

border-radius:15px;

margin-bottom:20px;

}

.reserva h2{

color:white;

margin-bottom:10px;

}

.reserva p{

color:#ddd;

margin-bottom:6px;

}

.estado{

color:#00d26a !important;

font-weight:bold;

}

.pendiente{

color:#ffd000 !important;

font-weight:bold;

}

button{

margin-top:15px;

width:100%;

padding:14px;

background:#c62828;

color:white;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:bold;

}

button:hover{

background:#e53935;

}

.volver{

position:fixed;

top:20px;

left:20px;

width:50px;

height:50px;

border-radius:50%;

background:#202020;

color:white;

display:flex;

justify-content:center;

align-items:center;

text-decoration:none;

font-size:30px;

}

</style>

</head>

<body>

<a href="javascript:history.back()" class="volver">←</a>

<div class="overlay">

<div class="contenedor">

<img src="img/Escudo_del_Club_Atlético_Sporting.png" class="escudo">

<h1>Mis Reservas</h1>

<div class="panel">

<div class="reserva">

<h2>⚽ Cancha 1</h2>

<p>📅 21/07/2026</p>

<p>🕒 20:00 - 21:00</p>

<p class="estado">🟢 Confirmada</p>

<button>VER DETALLE</button>

</div>

<div class="reserva">

<h2>⚽ Cancha 2</h2>

<p>📅 25/07/2026</p>

<p>🕒 21:00 - 22:00</p>

<p class="pendiente">🟡 Pendiente de Pago</p>

<button>PAGAR</button>

</div>

</div>

</div>

</div>

</body>

</html>
