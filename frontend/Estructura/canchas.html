/* ---------------------- */
/* MENÚ HAMBURGUESA */
/* ---------------------- */

#menu-toggle{

display:none;

}

.hamburguesa{

position:fixed;

top:25px;

left:25px;

width:55px;

height:55px;

background:#c62828;

color:white;

font-size:30px;

display:flex;

justify-content:center;

align-items:center;

border-radius:12px;

cursor:pointer;

z-index:1001;

transition:.3s;

box-shadow:0 5px 20px rgba(0,0,0,.35);

}

.hamburguesa:hover{

background:#e53935;

transform:scale(1.08);

}

.menu-lateral{

position:fixed;

top:0;

left:-300px;

width:280px;

height:100%;

background:#171717;

transition:.35s;

padding-top:30px;

box-shadow:10px 0 30px rgba(0,0,0,.45);

z-index:1000;

}

#menu-toggle:checked ~ .menu-lateral{

left:0;

}

.perfil{

text-align:center;

margin-bottom:40px;

}

.perfil img{

width:90px;

margin-bottom:10px;

}

.perfil h2{

color:white;

font-size:22px;

}

.menu-lateral a{

display:block;

padding:18px 30px;

color:white;

text-decoration:none;

font-size:18px;

transition:.3s;

}

.menu-lateral a:hover{

background:#c62828;

padding-left:40px;

}

</style>

</head>
