<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis Reservas | Sintético Sporting</title>
    <link rel="stylesheet" href="../css/mis_reservas.css">
    <script src="../js/mis_reservas.js" defer></script>
</head>

<body>

    <a href="canchas.html" class="volver">← Volver a Canchas</a>

    <div class="overlay">
        <main class="contenedor">

            <img
                src="../img/Escudo_del_Club_Atlético_Sporting.png"
                class="escudo"
                alt="Escudo del Club Atlético Sporting"
            >

            <h1>Mis Reservas</h1>

            <p class="subtitulo">
                Consultá tus partidos y el estado de tus pagos.
            </p>

            <div class="filtros">
                <button type="button" class="filtro activo" data-filtro="TODAS">
                    Todas
                </button>

                <button type="button" class="filtro" data-filtro="PENDIENTES">
                    Pendientes
                </button>

                <button type="button" class="filtro" data-filtro="CONFIRMADAS">
                    Confirmadas
                </button>

                <button type="button" class="filtro" data-filtro="CANCELADAS">
                    Canceladas
                </button>
            </div>

            <section class="panel">

                <div class="encabezado-panel">
                    <h2>📅 Tus partidos</h2>
                    <span id="cantidad-reservas">0 reservas</span>
                </div>

                <div id="lista-reservas"></div>

                <div id="sin-reservas" class="sin-reservas" hidden>
                    <div class="icono-vacio">⚽</div>
                    <h3>No hay reservas para mostrar</h3>
                    <p>
                        Cuando realices una reserva, podrás consultar
                        su estado desde esta pantalla.
                    </p>
                    <a href="canchas.html" class="btn-reservar">
                        RESERVAR CANCHA
                    </a>
                </div>

            </section>

            <p class="pie-pagina">
                CLUB ATLÉTICO SPORTING · RESERVAS ONLINE
            </p>

        </main>
    </div>

</body>
</html>
