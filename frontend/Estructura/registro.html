<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Registro</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:url("img/CANCHOTAAAAA.png");
background-size:cover;
background-position:center;
background-repeat:no-repeat;
min-height:100vh;

}

.overlay{

width:100%;
min-height:100vh;

background:rgba(0,0,0,.65);

display:flex;
justify-content:center;
align-items:center;

padding:30px;

}

.contenedor{

width:100%;
max-width:700px;

}

.escudo{

width:90px;
display:block;
margin:auto;
margin-bottom:15px;

}

h1{

color:white;
text-align:center;
margin-bottom:10px;
font-size:42px;

}

.subtitulo{

text-align:center;
color:#ddd;
margin-bottom:30px;

}

.panel{

background:rgba(20,20,20,.85);

padding:35px;

border-radius:20px;

box-shadow:0 15px 35px rgba(0,0,0,.45);

}

.formulario{

display:grid;

grid-template-columns:1fr 1fr;

gap:18px;

}

.grupo{

display:flex;

flex-direction:column;

}

.grupo-completo{

grid-column:1/3;

display:flex;

flex-direction:column;

}

label{

color:white;

margin-bottom:8px;

font-weight:500;

}

input{

padding:13px;

border:none;

border-radius:10px;

font-size:15px;

}

input:focus{

outline:2px solid #c62828;

}

.boton{

display:block;

width:100%;

padding:15px;

margin-top:30px;

background:#c62828;

color:white;

text-decoration:none;

text-align:center;

font-size:18px;

font-weight:bold;

border-radius:10px;

transition:.3s;

}

.boton:hover{

background:#e53935;

transform:scale(1.02);

}

.login{

margin-top:25px;

text-align:center;

color:white;

}

.login a{

color:#ff6464;

text-decoration:none;

font-weight:bold;

}

.login a:hover{

text-decoration:underline;

}

.volver{

position:fixed;

top:20px;

left:20px;

width:50px;

height:50px;

border-radius:50%;

background:rgba(20,20,20,.9);

color:white;

display:flex;

justify-content:center;

align-items:center;

text-decoration:none;

font-size:28px;

transition:.3s;

}

.volver:hover{

background:#c62828;

}

@media(max-width:700px){

.formulario{

grid-template-columns:1fr;

}

.grupo-completo{

grid-column:auto;

}

}

</style>

</head>

<body>

<a href="index.html" class="volver">←</a>

<div class="overlay">

<div class="contenedor">

<img src="img/Escudo_del_Club_Atlético_Sporting.png" class="escudo">

<h1>Crear Cuenta</h1>

<p class="subtitulo">

Completá tus datos para registrarte.

</p>

<div class="panel">

<div class="formulario">

<div class="grupo">

<label>Nombre</label>

<input type="text">

</div>

<div class="grupo">

<label>Apellido</label>

<input type="text">

</div>

<div class="grupo">

<label>DNI</label>

<input type="number">

</div>

<div class="grupo">

<label>Fecha de nacimiento</label>

<input type="date">

</div>

<div class="grupo-completo">

<label>Correo electrónico</label>

<input type="email">

</div>

<div class="grupo-completo">

<label>Teléfono</label>

<input type="tel">

</div>

<div class="grupo">

<label>Contraseña</label>

<input type="password">

</div>

<div class="grupo">

<label>Confirmar contraseña</label>

<input type="password">

</div>

</div>

<a href="canchas.html" class="boton">

CREAR CUENTA

</a>

<div class="login">

¿Ya tenés cuenta?

<a href="login.html">

Iniciar sesión

</a>

</div>

</div>

</div>

</div>

</body>

</html>
