<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro</title>

    <link rel="stylesheet" href="../css/registro.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>

<a href="index.html" class="volver">←</a>

<div class="overlay">

    <div class="contenedor">

        <img src="../img/Escudo_del_Club_Atlético_Sporting.png" class="escudo">

        <h1>Crear Cuenta</h1>

        <p class="subtitulo">
            Completá tus datos para registrarte.
        </p>

        <div class="panel">

            <form id="form-registro">

                <div class="formulario">

                    <div class="grupo">
                        <label>Nombre</label>
                        <input type="text" id="nombre">
                    </div>

                    <div class="grupo">
                        <label>Apellido</label>
                        <input type="text" id="apellido">
                    </div>

                    <div class="grupo">
                        <label>DNI</label>
                        <input type="number" id="dni">
                    </div>

                    <div class="grupo">
                        <label>Fecha de nacimiento</label>
                        <input type="date" id="fecha-nacimiento">
                    </div>

                    <div class="grupo-completo">
                        <label>Correo electrónico</label>
                        <input type="email" id="email">
                    </div>

                    <div class="grupo-completo">
                        <label>Teléfono</label>
                        <input type="tel" id="telefono">
                    </div>

                    <div class="grupo">
                        <label>Contraseña</label>
                        <input type="password" id="contrasena">
                    </div>

                    <div class="grupo">
                        <label>Confirmar contraseña</label>
                        <input type="password" id="confirmar-contrasena">
                    </div>

                </div>

                <p id="error-registro" class="oculto"></p>

                <button type="submit" class="boton" id="btn-crear-cuenta">
                    CREAR CUENTA
                </button>

            </form>

            <div class="login">
                ¿Ya tenés cuenta?

                <a href="login.html">
                    Iniciar sesión
                </a>
            </div>

        </div>

    </div>

</div>

<script src="../js/registro.js"></script>

</body>

</html>
