
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar Sesión | Sintético Sporting</title>

    <link rel="stylesheet" href="../css/login.css">
    <script src="../js/login.js" defer></script>
</head>

<body>

    <main class="login">

        <img
            src="../img/Escudo_del_Club_Atlético_Sporting.png"
            class="escudo"
            alt="Escudo del Club Atlético Sporting"
        >

        <h1>SINTÉTICO SPORTING</h1>

        <p>Reservá tu cancha de manera rápida y sencilla</p>

        <form id="formLogin">

            <label for="email">Email</label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Ingresá tu email"
                autocomplete="email"
                required
            >

            <label for="password">Contraseña</label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Ingresá tu contraseña"
                autocomplete="current-password"
                required
            >

            <button type="submit">
                INICIAR SESIÓN
            </button>

            <p id="mensajeError" role="status" aria-live="polite"></p>

        </form>

        <div class="registro">
            <p>¿No tenés cuenta?</p>

            <a href="registro.html" class="enlace-registro">
                REGISTRATE
            </a>
        </div>

    </main>

</body>
</html>
