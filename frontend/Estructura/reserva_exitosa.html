<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../css/reserva_exitosa.css">
    <title>Reserva Exitosa | Sintético Sporting</title>
</head>

<body>

<!-- Botón Hamburguesa accionado por JavaScript -->
<button type="button" class="hamburguesa" id="btn-hamburguesa" aria-label="Abrir menú" style="background: none; border: none;">☰</button>

<nav class="menu-lateral" id="menu-lateral">

    <div class="perfil">
        <img src="../img/Escudo_del_Club_Atlético_Sporting.png" alt="Escudo Sporting">
        <h2>SINTÉTICO SPORTING</h2>
        <p id="saludo-usuario" style="color: #fff; margin-top: 5px; font-size: 0.9em;"></p>
    </div>

    <a href="canchas.html">⚽ Reservar Cancha</a>
    <a href="mis_reservas.html">📅 Mis Reservas</a>
    <a href="mis_multas.html" style="color: #fbbf24;">⚠️ Mis Multas</a>
    <a href="javascript:void(0)" id="btn-cerrar-sesion">🚪 Cerrar Sesión</a>

</nav>

<div class="overlay">

    <div class="contenedor">

        <img src="../img/Escudo_del_Club_Atlético_Sporting.png" class="escudo" alt="Escudo Sporting">

        <div class="panel">

            <div class="check">
                ✔
            </div>

            <h1>¡RESERVA REALIZADA!</h1>

            <p class="mensaje">
                Tu reserva fue registrada correctamente.
            </p>

            <div class="detalle">
                <h3>⚽ Cancha</h3>
                <p id="reserva-cancha">-</p>
            </div>

            <div class="detalle">
                <h3>📅 Fecha</h3>
                <p id="reserva-fecha">-</p>
            </div>

            <div class="detalle">
                <h3>🕒 Horario</h3>
                <p id="reserva-horario">-</p>
            </div>

            <a href="canchas.html">
                <button type="button">
                    VOLVER AL INICIO
                </button>
            </a>

        </div>

    </div>

</div>

<script src="../js/reserva_exitosa.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", function() {
        const usuarioGuardado = sessionStorage.getItem("usuario");
        if (usuarioGuardado) {
            try {
                const u = JSON.parse(usuarioGuardado);
                const saludo = document.getElementById("saludo-usuario");
                if (saludo) saludo.textContent = `Hola, ${u.nombre || u.email}`;
            } catch(e) {}
        }
        
        const btnSalir = document.getElementById("btn-cerrar-sesion");
        if (btnSalir) {
            btnSalir.addEventListener("click", function() {
                sessionStorage.clear();
                localStorage.removeItem("usuario");
                window.location.href = "login.html";
            });
        }

        const btnHamburguesa = document.getElementById("btn-hamburguesa");
        const menuLateral = document.getElementById("menu-lateral");

        if (btnHamburguesa && menuLateral) {
            btnHamburguesa.addEventListener("click", function() {
                const leftActual = window.getComputedStyle(menuLateral).left;
                if (leftActual === "0px") {
                    menuLateral.style.left = "-290px";
                } else {
                    menuLateral.style.left = "0px";
                }
            });
        }
    });
</script>

</body>

</html>
